# Gauge's per-environment settings. See https://docs.gauge.org/configuration

# Where the specifications live. Gauge resolves this from here, not from the
# directory given on the command line -- `gauge run docs/specs` still looks in
# ./specs without it.
gauge_specs_dir = docs/specs

# Where the generated reports go. Ignored by git, like any other build output.
gauge_reports_dir = reports

# Keep one report per run rather than overwriting the last one.
overwrite_reports = false

# Screenshots are for browser suites; there is no browser here.
screenshot_on_failure = false

# The logs the runner writes.
logs_directory = logs
