# One image (Dockerfile -> Go + temporal-cli via Nix) backs every service, so
# the build is shared instead of repeated per service.
x-dev: &dev
  build: .
  image: temporal-workflow-kit-dev
  volumes:
    # Bind-mounted so edits on the host take effect without rebuilding the
    # image; the caches are named volumes so they survive `docker compose down`.
    - .:/workspace
    - go-mod-cache:/root/go
    - go-build-cache:/root/.cache/go-build

services:
  # Every `just` recipe runs here. The integration tests start their own
  # Temporal dev server in-process, so there is no server service to run
  # alongside it.
  dev:
    <<: *dev

volumes:
  go-mod-cache:
  go-build-cache:
