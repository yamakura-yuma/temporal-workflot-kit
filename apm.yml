name: temporal-workflow-kit-skills
version: 1.0.0
description: Agent configuration for the temporal-workflow-kit project
author: yamakura-yuma

# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, hermes, kiro, opencode, vscode, windsurf
targets:
- claude

# Two sources, one deploy. `apm install` here lands both in ./.claude/ (never
# ~/.claude/):
#
#   ./.apm/        this project's own domain knowledge, split four ways by where
#                  the knowledge comes from: saga-package (this saga/ package),
#                  temporal-review (Temporal in general), godog-specs (the
#                  executable spec suite) and upstream-docs (how to cite or
#                  cache an upstream doc). The last two read the same in any
#                  repo and carry no repo-specific paths in their bodies, so
#                  they can move to a shared package once one exists.
#   core-principal the shared harness (rules, guard hooks, core-* skills) from
#                  the dotfiles repo, pinned by commit because upstream
#                  publishes no tags; bump with `apm update`.
#
# The dividing line is whether it would read the same in another repo. If it
# would, it belongs in core-principal, not in ./.apm/ — a local fork of a shared
# skill is the thing to avoid.
dependencies:
  apm:
  - git: https://github.com/yamakura-yuma/dotfiles.git
    path: core-principal
    ref: 51856cebaa34d148600b7f64d20d34fac4f2401e
    alias: core-principal
    targets:
    - claude
  mcp: []

includes: auto
scripts: {}
